<!--
  vw_canonical_2019.svg -- A CANONICAL VECTOR OF THE VOLKSWAGEN MARK.

  THIS IS NOT A REFERENCE FRAME OF THE TARGET VEHICLE.  It deliberately does
  NOT carry the ref_ prefix, because CLAUDE.md rule 11 -- "check WHICH OBJECT"
  -- is the whole point of this file and a ref_ name would invite exactly the
  error it exists to document.

  WHAT IT IS.  The Volkswagen roundel as redrawn for the 2019 flat brand mark,
  taken from the `simple-icons` npm package (icons/volkswagen.svg), which is a
  maintained third-party trace.  IT IS NOT AN OFFICIAL BRAND SPECIFICATION and
  it is NOT the 1955-67 Type 2 chrome pressing that the target bus wears.

  WHY IT IS HERE.  rev 45 wrote down the right method -- "build the canonical
  mark and use the photograph to VERIFY" -- and eighteen revisions never did it
  because nobody went and got a canonical mark.  rev 63 went and got one.  This
  is that object, kept so the next context does not have to re-obtain it and so
  every figure derived from it can be recomputed.

  WHAT REV 63 MEASURED ON IT -- see probe_rev63_canon.py and F168.  Measured
  through probe_rev46_vw.py's OWN cream_cells() and cell_elongation(), at the
  photograph's own 41 x 69 raster:

        canonical 2019 mark      3 cells   elongation 1.597   ink 0.426
        PHOTOGRAPHED badge       7 cells   elongation 3.390   ink 0.606

  So it does NOT reproduce the photographed badge, and it must NOT be used as a
  fidelity target.  Two features the 2019 redraw dropped account for it: its V
  does not touch its W, and its legs stop short of the ring.  The pressing has
  both.  What it IS good for is the DIRECTION of the spine -- see F169.
-->
